semantic_layer:
  terms:
  - id: e5bf4301-417a-46ef-80d7-0a5a85ed1d96
    name: Financial Filing Submission
    description: A unique identifier for a specific financial filing submission, formatted
      as a CIK-year-period code.
    represents:
    - b469e8bb-3cf1-42b8-bb46-5f114a69f8cf
    columns_attributes:
    - id: 0faa069e-39d6-40ff-a104-e035967a29ac
      name: File Type
      description: The file type or format identifier for the submitted financial
        filing document.
      column_id: ddc153e0-9857-409e-9a2f-90c5c2d3ea57
    - id: 3a7e7ba3-6b7c-41e6-b177-5f24c2c3912b
      name: Statement Type
      description: The type of financial statement associated with the reported data,
        such as Balance Sheet (BS) or Income Statement (IS).
      column_id: b019f091-00a9-4591-9197-704d9adc0317
    - id: 408174f5-0602-4229-8a13-e90ad977dd4b
      name: Filing Submission Identifier
      description: A unique identifier for a specific financial filing submission,
        formatted as a CIK-year-period code.
      column_id: 62cc6506-7d31-4bd2-94f3-e22f53056dc6
    - id: 75a34df9-8718-404c-b971-1256d14cc2a3
      name: Line Number
      description: The line number within a financial statement where a specific tag
        or concept is reported.
      column_id: 20f9172c-4815-4248-8736-1a95ae7b2f79
    - id: b58fdaf2-f7e7-4f2d-aefb-72ea27beddc8
      name: Taxonomy Version
      description: The reporting taxonomy version and year, or a specific CIK filing
        identifier, indicating the regulatory framework used.
      column_id: 9592c370-0d5c-4aa9-8d28-c124f52c409a
    - id: bb60050a-b3dd-41bc-a633-278f8c98d510
      name: plabel
      description: The plain-text label describing the financial item, providing a
        human-readable name for the associated tag.
      column_id: 6bc9b87d-945e-4606-8bbd-de8ce31f9963
    - id: c7542144-81f4-4cdf-ba3c-eb991d9d9d27
      name: Negating Flag
      description: A boolean flag indicating whether the reported monetary value should
        be treated as negative in calculations.
      column_id: f7e6f826-85cc-4514-9290-e3d9d7132f89
    - id: e8cf669f-5b83-4e94-b6b9-f2c7254ae3be
      name: Report Number
      description: The sequential report number assigned to a filing within a given
        fiscal year and period.
      column_id: b3ccc057-3ea9-4fa0-bb71-73aa9c2a28b1
    - id: f04e8d2b-59e4-487c-b08c-5fa9ca580339
      name: Financial Concept Tag
      description: The specific financial concept or line item tag, such as Net Income
        or Stockholders' Equity, as defined by the taxonomy.
      column_id: 2731aff7-3d2b-418c-bd01-f6aff39a0ba7
    - id: ff85f24c-0886-48cb-91d5-5296b925eb07
      name: inpth
      description: A flag indicating whether the reported value represents an in-depth
        or detailed breakdown of a concept.
      column_id: fc63de1f-82fb-41fd-a257-d386a5f6f0b8
  - id: 6f09e8da-cac2-4afb-a47d-65abb53edf8e
    name: Financial Reporting Tag
    description: A financial reporting tag that identifies the specific line item
      or concept in an XBRL filing, such as AccountsPayableAndAccruedLiabilitiesCurrent
